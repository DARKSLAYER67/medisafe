name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          pkg-config \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          python3-setuptools \
          python3-dev \
          python3-pip \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libsqlite3-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        